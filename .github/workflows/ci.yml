name: Teste de API

# Adicionamos pull_request aqui para o CI rodar nos PRs também!
on: [push, pull_request]

jobs:
  verificar-api:
    runs-on: ubuntu-latest
    
    # PARTE 4: Testando em várias versões do Python
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }} #
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rodar Testes
        run: pytest test_main.py -v

      # PARTE 5: Subir a API e testar requisição real na nuvem
      - name: Subir a API e testar requisição (Integração)
        run: |
          # Sobe a API em background
          fastapi run main.py --port 8000 &
          
          # Pausa 3 segundos para dar tempo do servidor iniciar
          sleep 3
          
          # Testa as rotas usando o terminal do GitHub
          curl -f http://localhost:8000/
          curl -f http://localhost:8000/somar/5/3